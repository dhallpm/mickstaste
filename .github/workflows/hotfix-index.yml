name: Hotfix homepage live card

on:
  push:
    paths:
      - '.github/workflows/hotfix-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch homepage live-card route and cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("fetch('/api/todays-picks',{cache:'no-store'})", "fetch('/api/todays-picks/?t='+Date.now(),{cache:'no-store'})")
          s = s.replace('./site-rules-override.js?v=rules1', './site-rules-override.js?v=rules3-20260913-1138')
          p.write_text(s)
          PY
      - name: Commit homepage hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix production card route and bust override cache'
          git push origin main

name: Hotfix homepage live card

on:
  push:
    paths:
      - '.github/workflows/hotfix-index.yml'
      - 'scripts/hotfix_home_card.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch homepage
        run: python scripts/hotfix_home_card.py
      - name: Commit homepage patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Embed Sep 13 card directly in public homepage'
          git push origin main

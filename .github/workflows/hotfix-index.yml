name: Hotfix homepage live card

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch homepage
        run: python scripts/hotfix_home_card.py
      - name: Commit homepage patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage changes needed'
            exit 0
          fi
          git commit -m 'Embed Sep 13 card directly in public homepage'
          git push origin main
